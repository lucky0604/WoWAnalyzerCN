# For the Docker server (copied into the container in the Dockerfile)
server {
	listen 80;
	root   /usr/share/nginx/html;

	# CN fork: Proxy WCL API requests to wcl-proxy-server on the host machine
	# 在宿主机运行 wcl-proxy-server (port 9528)，nginx 通过 host.docker.internal 连接
	# 如不使用 CN WCL API，删除此 location 块即可
	location /wcl-api {
		proxy_pass http://host.docker.internal:9528/v1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /static {
		# Don't fallback to index, but show a 404 error to prevent invalid chunk requests from being cached.
	}
	location / {
		index  index.html index.htm;
		try_files $uri /index.html;
	}
	error_page   500 502 503 504  /50x.html;
}
