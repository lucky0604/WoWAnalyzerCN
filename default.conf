# For the Docker server (copied into the container in the Dockerfile)
server {
	listen 80;
	root   /usr/share/nginx/html;

	# CN fork: 代理 /wcl-api 请求到 CN WCL API 服务器
	# 当 VITE_WCL_DIRECT=true 且 VITE_WCL_API_BASE 为空时，前端请求 /wcl-api/...
	# 此处将其代理到 CN WCL API（/v1/...），避免返回 index.html 导致 JSON 解析错误
	location /wcl-api/ {
		proxy_pass https://wcl-live-mp.rpglogs.cn/v1/;
		proxy_ssl_server_name on;
		proxy_set_header Host wcl-live-mp.rpglogs.cn;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Accept-Encoding "";
	}

	location /i/ {
		proxy_pass https://wowanalyzer.com/i/;
		proxy_ssl_server_name on;
		proxy_set_header Host wowanalyzer.com;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Accept-Encoding "";
	}

	# CN fork: 角色资料走 CN 英雄榜网关。同源代理以绕过网关 CORS 对 auth 头的限制。
	# 前端请求 /cn-armory/wow-armory-server/api/... → 去掉 /cn-armory 前缀转发到网关。
	location /cn-armory/ {
		rewrite ^/cn-armory/(.*)$ /$1 break;
		proxy_pass https://webapi.rpglogs.cn;
		proxy_ssl_server_name on;
		proxy_set_header Host webapi.rpglogs.cn;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Accept-Encoding "";
	}

	location = /user {
		default_type application/json;
		return 401 '{"message":"Unauthorized"}';
	}

	location = /logout {
		default_type application/json;
		return 204;
	}

	location /static {
		# Don't fallback to index, but show a 404 error to prevent invalid chunk requests from being cached.
	}
	location / {
		index  index.html index.htm;
		try_files $uri /index.html;
	}
	error_page   500 502 503 504  /50x.html;
}
