# For the Docker server (copied into the container in the Dockerfile)
server {
	listen 80;
	root   /usr/share/nginx/html;

	# CN fork: 代理 WCL API 请求到线上地址
	# 前端请求 /wcl-api/xxx -> 代理到 https://wcl-live-mp.rpglogs.cn/v1/xxx
	location /wcl-api/ {
		proxy_pass https://wcl-live-mp.rpglogs.cn/v1/;
		proxy_ssl_server_name on;
		proxy_set_header Host wcl-live-mp.rpglogs.cn;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /static {
		# Don't fallback to index, but show a 404 error to prevent invalid chunk requests from being cached.
	}
	location / {
		index  index.html index.htm;
		try_files $uri /index.html;
	}
	error_page   500 502 503 504  /50x.html;
}
