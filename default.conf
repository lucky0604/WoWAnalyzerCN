# For the Docker server (copied into the container in the Dockerfile)
server {
	listen 80;
	root   /usr/share/nginx/html;

	# CN fork: Proxy WCL API requests to wcl-proxy-server
	# If not using CN WCL API, set VITE_WCL_DIRECT=false and remove this block
	location /wcl-api {
		proxy_pass http://wcl-proxy:9528/v1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /static {
		# Don't fallback to index, but show a 404 error to prevent invalid chunk requests from being cached.
	}
	location / {
		index  index.html index.htm;
		try_files $uri /index.html;
	}
	error_page   500 502 503 504  /50x.html;
}
