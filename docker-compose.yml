services:
  nginx:
    build:
      context: .
      args:
        # CN fork: true=前端请求 /wcl-api（需外层反代），false=走 VITE_SERVER_BASE
        VITE_WCL_DIRECT: '${VITE_WCL_DIRECT:-true}'
        VITE_SERVER_BASE: '${VITE_SERVER_BASE:-/}'
        VITE_ENABLE_GA: '${VITE_ENABLE_GA:-false}'
    ports:
      - '${NGINX_PORT:-8080}:80'
    restart: unless-stopped
    networks:
      - wowanalyzer

networks:
  wowanalyzer:
    driver: bridge
