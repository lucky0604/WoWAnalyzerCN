services:
  nginx:
    build:
      context: .
      args:
        PNPM_VERSION: '${PNPM_VERSION:-9.5.0}'
        NPM_CONFIG_REGISTRY: '${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}'
        # CN fork: 直连 WCL API 地址（需 CORS 支持）
        # 设置此项后，前端直接请求该地址，无需 nginx 代理
        VITE_WCL_API_BASE: '${VITE_WCL_API_BASE:-https://wcl-live-mp.rpglogs.cn}'
        # CN fork: true=前端请求 /wcl-api（需 nginx 代理），false=直连 VITE_WCL_API_BASE
        VITE_WCL_DIRECT: '${VITE_WCL_DIRECT:-false}'
        VITE_SERVER_BASE: '${VITE_SERVER_BASE:-/}'
        # 后端 API 路径前缀，必须与 nginx location 匹配
        VITE_API_BASE: '${VITE_API_BASE:-i/}'
        VITE_ENABLE_GA: '${VITE_ENABLE_GA:-false}'
        VITE_DISABLE_USER_FETCH: '${VITE_DISABLE_USER_FETCH:-true}'
        # CN fork: 关闭依赖 wowanalyzer.com 后端的功能，相关 UI 入口一并隐藏
        VITE_DISABLE_SOCIAL_FEATURES: '${VITE_DISABLE_SOCIAL_FEATURES:-true}'
    environment:
      WCL_API_PROXY_TARGET: '${WCL_API_PROXY_TARGET:-https://wcl-live-mp.rpglogs.cn/v1/}'
      WCL_API_PROXY_HOST: '${WCL_API_PROXY_HOST:-wcl-live-mp.rpglogs.cn}'
      CN_ARMORY_API_PROXY_TARGET: '${CN_ARMORY_API_PROXY_TARGET:-https://webapi.rpglogs.cn}'
      CN_ARMORY_API_PROXY_HOST: '${CN_ARMORY_API_PROXY_HOST:-webapi.rpglogs.cn}'
    ports:
      - '${NGINX_PORT:-9000}:80'
    restart: unless-stopped
    networks:
      - wowanalyzer

networks:
  wowanalyzer:
    driver: bridge
